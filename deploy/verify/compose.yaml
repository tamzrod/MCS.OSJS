# UMIG-004-E: disposable verification stack ONLY. NEVER combine with
# deploy/docker-compose.yml or use on the operator's production Docker daemon.
# Run with a unique --project-name on a verified disposable sandbox daemon.
# No container_name, external volumes, host networking or host Modbus ports.
services:
  seed:
    image: alpine:3.19
    restart: "no"
    network_mode: none
    volumes:
      - verify-data:/data
    command:
      - sh
      - -ec
      - |
        # Refuse reuse of ANY populated data volume, especially user data.
        test -z "$(ls -A /data)" || { echo 'VERIFY REFUSED: data volume is not empty' >&2; exit 1; }
        mkdir -p /data/config/mma2 /data/config/simulator
        printf 'listeners: []\n' > /data/config/mma2/config.yaml
        # Explicit disposable canonical empty document: avoids Go's nil-slice
        # JSON representation when no devices.yaml has ever existed.
        printf 'devices: []\n' > /data/config/simulator/devices.yaml

  mma2:
    build:
      context: ../../MMA2
      dockerfile: Dockerfile.supervised
    restart: "no"
    init: true
    # Test-only permission accommodation: seed/Simulator create files under
    # /data/config/mma2 as root. MMA2 supervisor must write restart-ack there.
    # This does NOT change the production Dockerfile or Compose configuration.
    user: "0:0"
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - verify-data:/data
    networks:
      - verify-runtime

  modbus-simulator-runtime:
    build:
      context: ../..
      dockerfile: simulator/Dockerfile
    restart: "no"
    init: true
    environment:
      OSJS_DATA_DIR: /data
    depends_on:
      mma2:
        condition: service_started
    # Existing Simulator 127.0.0.1 readiness and Raw Ingest traffic stays
    # within this disposable MMA2 network namespace, not the host network.
    network_mode: service:mma2
    volumes:
      - verify-data:/data

  osjs-shell:
    build:
      context: ../../OSJS
      dockerfile: Dockerfile
    restart: "no"
    init: true
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PORT: "18209"
      OSJS_DATA_DIR: /data
    ports:
      - "127.0.0.1:${MCS_VERIFY_OSJS_PORT:-18219}:18209"
    volumes:
      - verify-data:/data
    networks:
      - verify-ui

networks:
  verify-runtime:
    driver: bridge
    internal: true
  verify-ui:
    driver: bridge

volumes:
  verify-data: {}
