listeners:
  - id: policy-test
    listen: 127.0.0.1:5100
    memory:
      - unit_id: 1
        holding_registers: {start: 0, count: 1}
        policy:
          rules:
            - id: allow-all-rw
              source_ip: [0.0.0.0/0]
              allow_fc: [1, 2, 3, 4, 5, 6, 15, 16]
      - unit_id: 2
        holding_registers: {start: 0, count: 1}
        policy:
          rules:
            - id: allow-all-read
              source_ip: [0.0.0.0/0]
              allow_fc: [1, 2, 3, 4]
      - unit_id: 3
        holding_registers: {start: 0, count: 1}
        policy:
          rules:
            - id: restricted-read
              source_ip: [192.168.1.0/24, 127.0.0.1]
              allow_fc: [3]
  - id: default-deny-test
    listen: 127.0.0.1:5101
    memory:
      - unit_id: 1
        holding_registers: {start: 0, count: 1}
