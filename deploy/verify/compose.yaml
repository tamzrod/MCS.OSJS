# Test ONLY: standalone disposable Compose. Never combine with operator Compose.
# Fresh --project-name, sandbox-local daemon, scoped volume; no published Modbus ports.
services:
  seed:
    image: alpine:3.19
    restart: "no"
    network_mode: none
    volumes:
      - verify-data:/data
    command:
      - sh
      - -ec
      - |
        # Refuse reuse of ANY populated volume, including retained earlier test data.
        test -z "$(ls -A /data)" || { echo 'VERIFY REFUSED: data volume is not empty' >&2; exit 1; }
        mkdir -p /data/config/mma2 /data/config/simulator /data/config/replicator
        printf 'listeners: []\n' > /data/config/mma2/config.yaml
        printf 'devices: []\n' > /data/config/simulator/devices.yaml
        printf 'devices: []\n' > /data/config/replicator/devices.yaml

  mma2:
    build:
      context: ../../MMA2
      dockerfile: Dockerfile.supervised
    restart: "no"
    init: true
    # Test-only write access for supervisor restart acknowledgment, not privileged.
    user: "0:0"
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - verify-data:/data
    networks:
      - verify-runtime

  modbus-simulator-runtime:
    build:
      context: ../..
      dockerfile: simulator/Dockerfile
    restart: "no"
    init: true
    environment:
      OSJS_DATA_DIR: /data
    depends_on:
      mma2:
        condition: service_started
    # Test MMA2 loopback for readiness and Raw Ingest, never host loopback.
    network_mode: service:mma2
    volumes:
      - verify-data:/data

  modbus-replicator-runtime:
    build:
      context: ../..
      dockerfile: replicator/Dockerfile
    restart: "no"
    init: true
    environment:
      OSJS_DATA_DIR: /data
    depends_on:
      mma2:
        condition: service_started
    # Synthetic source 127.0.0.1:15020 and destination 15021 live ONLY
    # in this shared private network namespace. No host or LAN access.
    network_mode: service:mma2
    volumes:
      - verify-data:/data

  osjs-shell:
    build:
      context: ../../OSJS
      dockerfile: Dockerfile
    restart: "no"
    init: true
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PORT: "18209"
      OSJS_DATA_DIR: /data
    ports:
      - "127.0.0.1:${MCS_VERIFY_OSJS_PORT:-18219}:18209"
    volumes:
      - verify-data:/data
    networks:
      - verify-ui

networks:
  verify-runtime:
    driver: bridge
    internal: true
  verify-ui:
    driver: bridge

volumes:
  verify-data: {}
